<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Splat spike viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #d4d4d4;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  #drop { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; z-index: 10; }
  #drop.hidden { display: none; }
  #drop.over { outline: 2px dashed #666; outline-offset: -24px; }
  #status { position: fixed; left: 12px; bottom: 12px; z-index: 10; opacity: .7; }
  input[type=file] { color: #d4d4d4; }
</style>
</head>
<body>
<div id="drop">
  <div>Drop a <b>.ply</b> / <b>.splat</b> here (output of splat_spike.py)</div>
  <input id="file" type="file" accept=".ply,.splat,.ksplat" />
  <div style="opacity:.5">orbit: drag &nbsp;·&nbsp; pan: right-drag &nbsp;·&nbsp; zoom: wheel</div>
</div>
<div id="status"></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.min.js"
} }
</script>
<script type="module">
import * as GaussianSplats3D from 'gaussian-splats-3d';

const drop = document.getElementById('drop');
const status = document.getElementById('status');

const FORMATS = {
  ply: GaussianSplats3D.SceneFormat.Ply,
  splat: GaussianSplats3D.SceneFormat.Splat,
  ksplat: GaussianSplats3D.SceneFormat.KSplat,
};

async function load(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!(ext in FORMATS)) { status.textContent = `unsupported file: ${file.name}`; return; }
  drop.classList.add('hidden');
  status.textContent = `loading ${file.name}…`;
  const viewer = new GaussianSplats3D.Viewer({
    cameraUp: [0, -1, 0],
    initialCameraPosition: [0, 0, -3],
    initialCameraLookAt: [0, 0, 0],
    sharedMemoryForWorkers: false, // no COOP/COEP headers on a plain http.server
  });
  await viewer.addSplatScene(URL.createObjectURL(file), {
    format: FORMATS[ext],
    progressiveLoad: false,
  });
  viewer.start();
  status.textContent = `${file.name} — ${viewer.getSplatMesh().getSplatCount().toLocaleString()} splats`;
}

document.getElementById('file').addEventListener('change', (e) => {
  if (e.target.files[0]) load(e.target.files[0]);
});
window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
window.addEventListener('dragleave', () => drop.classList.remove('over'));
window.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
