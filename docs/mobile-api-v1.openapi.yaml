openapi: 3.1.0
info:
  title: Arc Mobile API
  version: 1.0.0
servers:
  - url: https://app.arcnaples.com/api/mobile/v1
security:
  - bearerAuth: []
paths:
  /workspace:
    get:
      summary: List native workspace modules allowed for the current user and project posture
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Module definitions with id, title, group, SF Symbol name and permission-filtered create_fields and edit_fields. Fields may use kind rows with nested field definitions; their submitted value is a JSON array of string dictionaries (at most 100 rows and 10000 characters).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not available to this user }
        "422": { description: Invalid project identifier }
  /workspace/{module}:
    parameters:
      - $ref: "#/components/parameters/OrganizationHeader"
      - name: module
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read allowed native workspace records
      description: Returns explicitly projected scalar fields; this is a bounded list, not an export or a complete financial report.
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Envelope containing records with id, title, status and labeled fields }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Invalid project identifier }
    post:
      summary: Create a record using the permission-filtered native module composer
      description: Permissions and project visibility are rechecked. Only module-defined input fields are accepted. Do not automatically retry a submission with an uncertain outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                project_id: { type: string, format: uuid }
                values:
                  type: object
                  additionalProperties: { type: string, maxLength: 10000 }
      responses:
        "201": { description: Record saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { description: Module does not support creation }
        "422": { description: Invalid input with a user-facing validation message }
  /workspace/billing/drafts:
    post:
      summary: Create a manual project invoice draft with native line items
      description: Rechecks project visibility and invoice.write. Forces draft intent; issuance, source links, accounting mappings, and arbitrary metadata cannot be supplied. Uses Arc invoice validation and calculation services.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, invoice_number, title, issue_date, due_date, lines]
              properties:
                project_id: { type: string, format: uuid }
                invoice_number: { type: string, minLength: 1, maxLength: 80 }
                title: { type: string, minLength: 3, maxLength: 200 }
                issue_date: { type: string, format: date }
                due_date: { type: string, format: date }
                tax_rate: { type: number, minimum: 0, maximum: 20 }
                notes: { type: string, maxLength: 2000 }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [description, quantity, unit_cost]
                    properties:
                      description: { type: string, minLength: 1, maxLength: 1000 }
                      quantity: { type: number, minimum: 0.01, maximum: 1000000 }
                      unit: { type: string, maxLength: 20 }
                      unit_cost: { type: number, minimum: 0, maximum: 100000000, description: Price in currency units, not cents }
                      taxable: { type: boolean }
      responses:
        "201": { description: Envelope containing the created invoice id }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Invalid invoice fields, lines, or dates }
  /workspace/estimates/{recordId}/pdf:
    get:
      summary: Download a proposal or agreement PDF for native preview
      description: Requires the project estimate module permission and exact organization/project membership. Executed documents use their stored signed PDF without falling back to live rendering. Drafts use the canonical web PDF renderer. Response is private and not cached.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Estimate or stored executed PDF unavailable }
        "422": { description: Invalid identifier }
  /workspace/billing/{recordId}/draft:
    parameters:
      - $ref: "#/components/parameters/OrganizationHeader"
      - name: recordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Load an editable manual invoice draft with its revision
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Envelope containing revision and input. Input has the creation fields and optional existing line IDs. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Invoice not in this project }
        "409": { description: Issued, externally synchronized or source-derived invoice cannot be edited as a manual draft }
    patch:
      summary: Revise a manual draft while preserving server accounting links
      description: Existing line IDs must belong to this invoice and cannot repeat. Client-supplied accounting/source links are ignored. Checks revision and canonical transactional concurrency controls. Does not issue or send the invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, input]
              properties:
                revision: { type: string }
                input:
                  type: object
                  description: Same fields as invoice draft creation, with optional existing line IDs.
      responses:
        "200": { description: Draft saved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Invoice not in this project }
        "409": { description: Draft changed or is no longer editable }
        "422": { description: Invalid invoice or line identity }
  /workspace/{module}/{recordId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationHeader"
      - name: module
        in: path
        required: true
        schema: { type: string }
      - name: recordId
        in: path
        required: true
        description: Record UUID; report slugs and signature draft identifiers are accepted for GET.
        schema: { type: string }
    get:
      summary: Read a native record, related sections, signed documents, and permitted actions
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: filters
          in: query
          description: JSON object of string values for report-defined filter keys only.
          schema: { type: string }
      responses:
        "200": { description: Envelope containing record, sections, actions and documents. Actions carry fields and an optional revision. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Record not visible in the selected workspace }
        "422": { description: Invalid identifier or filters }
    patch:
      summary: Edit the explicitly supported fields of a native record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                project_id: { type: string, format: uuid }
                values: { type: object, additionalProperties: { type: string, maxLength: 10000 } }
      responses:
        "200": { description: Record saved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Record not visible in the selected workspace }
        "422": { description: Invalid input }
    post:
      summary: Perform an available native record action
      description: Rechecks visibility, permissions, child-record membership, current action availability and supplied revision. Do not automatically retry uncertain mutation outcomes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id, values]
              properties:
                project_id: { type: string, format: uuid }
                action_id: { type: string, maxLength: 100 }
                expected_revision: { type: string, maxLength: 100 }
                values: { type: object, additionalProperties: { type: string, maxLength: 10000 } }
      responses:
        "200": { description: Action completed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Record changed since review }
        "422": { description: Invalid action input }
  /projects/{projectId}/photos:
    parameters:
      - $ref: "#/components/parameters/OrganizationHeader"
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Browse project photos and albums with expiring native media URLs
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 30 } }
        - { name: albumId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: Envelope containing photos, albums, next_cursor and can_upload. Photos include signed download_url and thumbnail_url. }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create or reuse a daily log for photo capture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_date]
              properties:
                local_date: { type: string, format: date }
      responses:
        "200": { description: Envelope containing the daily log id for the existing daily-log photo upload endpoint }
        "403": { $ref: "#/components/responses/Forbidden" }
  /session:
    get:
      summary: Resolve the current user, organizations, and preferred organization
      responses:
        "200":
          description: Current mobile session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /organizations:
    get:
      summary: List organizations available to the current user
      responses:
        "200":
          description: Organization list
        "401": { $ref: "#/components/responses/Unauthorized" }
  /projects:
    get:
      summary: List permission-filtered projects for the selected organization
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Project page
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}:
    get:
      summary: Get one permission-filtered project
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Project }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/daily-logs:
    get:
      summary: List a project's daily-log timeline with entries, comments, and photo counts
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Daily-log timeline }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
    post:
      summary: Create an idempotent daily log and structured entries
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyLogInput" }
      responses:
        "201": { description: Daily log created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Invalid daily log }
  /projects/{projectId}/daily-logs/context:
    get:
      summary: Load schedule, task, punch, and project-team options for daily-log entry
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Daily-log supporting context }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/daily-logs/{dailyLogId}:
    patch:
      summary: Update a daily log summary, weather, and mentions
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DailyLogId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string }
                weather: { type: string }
                mentioned_user_ids: { type: array, items: { type: string, format: uuid } }
                expected_revision:
                  type: string
                  description: >
                    The record's `updated_at` exactly as the app last received
                    it. Optional; when sent, a record that has changed since is
                    refused with 409 `stale_revision` and nothing is written.
      responses:
        "200": { description: Updated daily log }
        "409": { $ref: "#/components/responses/StaleRevision" }
    delete:
      summary: Delete a daily log
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DailyLogId"
      responses:
        "200": { description: Daily log deleted }
  /projects/{projectId}/daily-logs/{dailyLogId}/comments:
    post:
      summary: Add an idempotent comment with mentions
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DailyLogId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Comment created }
  /projects/{projectId}/daily-logs/{dailyLogId}/photos:
    post:
      summary: Upload an idempotent daily-log photo
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DailyLogId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [client_id, file]
              properties:
                client_id: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        "201": { description: Photo uploaded }
  /projects/{projectId}/drawings/sets:
    get:
      summary: List a project's drawing sets (register) with sheet counts
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Drawing sets }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/drawings/sheets:
    get:
      summary: List a project's published drawing sheets with thumbnails and pin counts
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Drawing sheets }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/drawings/sheets/{sheetId}:
    get:
      summary: Get a drawing sheet with full image, version history, and pins
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SheetId"
      responses:
        "200": { description: Drawing sheet detail }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Drawing sheet not found }
  /projects/{projectId}/schedule:
    get:
      summary: List a project's schedule items (agenda) with progress and assignees
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Schedule items }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/tasks:
    get:
      summary: List a project's tasks with assignees and status
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Tasks }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/tasks/{taskId}:
    patch:
      summary: Update a task's status (e.g. mark done)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [todo, in_progress, blocked, done] }
                expected_revision:
                  type: string
                  description: >
                    The record's `updated_at` exactly as the app last received
                    it. Optional; when sent, a record that has changed since is
                    refused with 409 `stale_revision` and nothing is written.
      responses:
        "200": { description: Updated task }
        "409": { $ref: "#/components/responses/StaleRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Task not found }
        "422": { description: Invalid status }
  /my-houses:
    get:
      summary: The superintendent's assigned houses, across every project
      description: >
        Org-scoped, not project-scoped. A superintendent runs 10-15 houses at
        once, so the field surface is the whole roster rather than one job.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200": { description: Assigned houses }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /my-houses/work:
    get:
      summary: This window's scheduled work, grouped by activity across houses
      description: >
        Grouped by activity ("Frame inspection - 6") because the job is one
        activity across many lots, not one house at a time.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - { name: window, in: query, required: false, schema: { type: string, enum: [today, week, twoweek] } }
      responses:
        "200": { description: Work grouped by activity }
        "400": { description: Unsupported window }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /my-houses/schedule-items/{scheduleItemId}/complete:
    post:
      summary: Complete a scheduled item without leaving the cross-house feed
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - { name: scheduleItemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                progress: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200": { description: Completion result }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Schedule item not found }
  /organizations/{organizationId}/reason-codes:
    get:
      summary: Variance reason codes for field VPO capture
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Reason codes }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/purchase-orders:
    get:
      summary: Purchase orders a field variance can be charged against
      description: >
        Excludes drafts and cancelled commitments. A VPO revises a specific PO,
        so the field needs the list before the house has any variance history.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Purchase orders }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/vpos:
    get:
      summary: List a project's variance purchase orders
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Variance purchase orders }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: File a variance purchase order from the field
      description: >
        Charges a purchase order, not a cost code. Backcharge reason codes must
        post a negative amount.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitment_id, reason_code_id, amount_cents, note]
              properties:
                commitment_id: { type: string, format: uuid }
                reason_code_id: { type: string, format: uuid }
                amount_cents: { type: integer }
                note: { type: string }
                photo_file_ids: { type: array, items: { type: string, format: uuid } }
                client_id: { type: string, format: uuid }
      responses:
        "201": { description: Variance purchase order created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Invalid variance purchase order }
  /projects/{projectId}/punch-items:
    get:
      summary: List a project's punch-list items
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Punch items }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/punch-items/{punchItemId}:
    patch:
      summary: Update a punch item's status (e.g. close)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - { name: punchItemId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, in_progress, ready_for_review, closed] }
                expected_revision:
                  type: string
                  description: >
                    The record's `updated_at` exactly as the app last received
                    it. Optional; when sent, a record that has changed since is
                    refused with 409 `stale_revision` and nothing is written.
      responses:
        "200": { description: Updated punch item (includes `updated_at`, the revision to send back) }
        "409": { $ref: "#/components/responses/StaleRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Punch item not found }
        "422": { description: Invalid status }
  /projects/{projectId}/expenses:
    get:
      summary: List a project's submitted expenses with signed receipt URLs
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Expenses }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
    post:
      summary: Submit an expense with an optional receipt photo (multipart)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  description: JSON with client_id, expense_date, amount_dollars, tax_dollars, vendor_name, payment_method, description
                receipt: { type: string, format: binary }
      responses:
        "201": { description: Created expense }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
        "422": { description: Invalid expense }
  /projects/{projectId}/expenses/scan:
    post:
      summary: Extract structured fields from a receipt image with AI (multipart)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt: { type: string, format: binary }
      responses:
        "200": { description: Extracted receipt fields }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Receipt could not be scanned }
  /projects/{projectId}/files:
    get:
      summary: Browse a project's documents folder with signed download URLs
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - { name: folder, in: query, required: false, schema: { type: string, default: "/" } }
        - { name: recursive, in: query, required: false, schema: { type: boolean, default: false }, description: Include all unarchived project documents for a download/search manifest. Excludes daily-log photo files. }
      responses:
        "200": { description: Folders and files }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
    post:
      summary: Upload a document to a project folder (multipart)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, client_id]
              properties:
                file: { type: string, format: binary }
                client_id: { type: string, description: Client-generated UUID for idempotency }
                folder: { type: string, default: "/" }
                category: { type: string, description: "One of plans|contracts|permits|submittals|photos|rfis|safety|financials|other" }
      responses:
        "201": { description: Created file }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
        "422": { description: Invalid file }
  /projects/{projectId}/files/{fileId}:
    delete:
      summary: Archive (soft-delete) a project document
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: File not found }
        "409": { description: File belongs to a daily log }
  /notifications:
    get:
      summary: List the signed-in user's notifications for the selected org
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200": { description: Notifications with unread count }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/{notificationId}/read:
    post:
      summary: Mark a single notification as read
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated notification }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Notification not found }
  /notifications/read-all:
    post:
      summary: Mark all of the user's notifications as read
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200": { description: Count of notifications updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /platform/audit-log:
    get:
      summary: List recent platform authorization audit events
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Recent platform audit entries }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /platform/issues:
    get:
      summary: List platform issues
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Platform issues }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a platform issue
      responses:
        "201": { description: Platform issue created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Invalid issue payload }
  /projects/{projectId}/rfis:
    get:
      summary: List a project's RFIs with status, priority, and assignee
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: RFIs }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/correspondence:
    get:
      summary: List a project's filed correspondence, newest first
      description: >
        Read-only. Ruling on a classification and linking a message to a record
        are workbench decisions; the field needs to see what a vendor sent.
        Requires `correspondence.read` on the project.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Correspondence }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /projects/{projectId}/team:
    get:
      summary: List a project's active team members
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Team members }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Project not found }
  /payables:
    get:
      summary: List payables awaiting the caller's approval
      description: >
        Scoped to projects where the caller holds `bill.approve`. Ordered by due
        date, oldest first. Page-numbered rather than cursored: the queue is a
        deadline list that changes as approvals land.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: search
          in: query
          description: Matches bill number or vendor name.
          schema: { type: string, maxLength: 120 }
      responses:
        "200": { description: Approval queue with pagination }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Caller may not approve payables in this organization }
  /payables/{id}:
    get:
      summary: Read one payable in decision detail
      description: >
        Adds the invoice document and advisory evidence (commitment line match,
        lien-waiver verification) to the list row. `can_approve` is false when the
        caller may read but not decide, or when a blocking payment hold stands.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payable detail }
        "400": { description: Invalid payable id }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Payable not found }
  /payables/{id}/decision:
    post:
      summary: Approve or reject a payable
      description: >
        Delegates to the same service the web desk uses, so `bill.approve`, the
        rejection-reason rule, and ledger propagation are identical. No step-up
        challenge: approving a bill accepts an obligation rather than releasing
        money, matching the web control model. `expected_updated_at` is required
        and must echo the value the client was shown.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expected_updated_at]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                expected_updated_at: { type: string }
                reason:
                  type: string
                  minLength: 8
                  maxLength: 1000
                  description: Required when rejecting; shown to the vendor verbatim.
      responses:
        "200": { description: Decision recorded }
        "400": { description: Invalid decision payload }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: The payable changed since it was read }
        "422": { description: The decision was refused by the approval rules }
  /devices:
    post:
      summary: Register an APNs device token for push notifications
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                platform: { type: string }
                app_version: { type: string }
                environment: { type: string, enum: [production, sandbox] }
      responses:
        "201": { description: Device registered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Invalid device token }
    delete:
      summary: Unregister an APNs device token (e.g. on sign-out)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Device unregistered }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
  parameters:
    OrganizationHeader:
      name: X-Arc-Organization-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        A client-generated key (at most 200 characters) that is stable across
        retries of one queued mutation. The first request with a key is applied
        and its result stored for 30 days. A replay with the same key and the
        same body returns that stored result without applying it again, with an
        `Idempotent-Replay: true` response header. The same key with a different
        method, path or body is a 409 `idempotency_key_reuse`; the same key
        while the first request is still running is a 409
        `idempotency_in_progress` (retry shortly). Failed requests are not
        stored, so a retry after an error runs again. Sent by the offline queue.
      schema: { type: string, maxLength: 200 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DailyLogId:
      name: dailyLogId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SheetId:
      name: sheetId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    StaleRevision:
      description: >
        `expected_revision` no longer matches the record (`stale_revision`), or
        the Idempotency-Key conflicts (`idempotency_key_reuse`,
        `idempotency_in_progress`). A `stale_revision` error carries the
        record as it stands now in `error.current`, so the app can show the
        difference and let the user re-apply or discard the queued change.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing, invalid, or expired Supabase access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: User is not an active member of the selected organization
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    User:
      type: object
      required: [id, email, display_name, avatar_url]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"], format: uri }
    Organization:
      type: object
      required: [id, name, slug, logo_url, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: [string, "null"] }
        logo_url: { type: [string, "null"], format: uri }
        role: { type: [string, "null"] }
    Project:
      type: object
      required: [id, organization_id, name, status, address, start_date, end_date, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        address: { type: [string, "null"] }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        updated_at: { type: string, format: date-time }
    DailyLogEntryInput:
      type: object
      required: [entry_type]
      properties:
        entry_type:
          type: string
          enum: [work, constraint, inspection, safety, delivery, note, task_update, punch_update]
        description: { type: string }
        quantity: { type: number, minimum: 0 }
        hours: { type: number, minimum: 0, maximum: 24 }
        progress: { type: number, minimum: 0, maximum: 100 }
        schedule_item_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        punch_item_id: { type: string, format: uuid }
        location: { type: string }
        trade: { type: string }
        inspection_result: { type: string, enum: [pass, fail, partial, n_a] }
        metadata:
          type: object
          additionalProperties: { type: boolean }
    DailyLogInput:
      type: object
      required: [client_id, date, entries, mentioned_user_ids]
      properties:
        client_id: { type: string, format: uuid }
        date: { type: string, format: date }
        summary: { type: string }
        weather: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DailyLogEntryInput" }
        mentioned_user_ids:
          type: array
          items: { type: string, format: uuid }
    Session:
      type: object
      required: [user, organizations, selected_organization_id]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        selected_organization_id: { type: [string, "null"], format: uuid }
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        next_cursor: { type: [string, "null"] }
    SessionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Session" }
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
            current:
              description: On a 409 `stale_revision`, the record as it stands now (same shape as the endpoint's success response).
        request_id: { type: string }
