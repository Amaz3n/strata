# Local/CI database contract environment. This project is intentionally distinct
# from every hosted Arc project; `supabase test db` must never target `.env.local`.
project_id = "arc-local-contracts"

[api]
enabled = false
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 54323

[inbucket]
enabled = false
port = 54324

[storage]
enabled = false
file_size_limit = "100MiB"

# Every Arc RLS policy calls auth.uid() or auth.jwt(). With auth disabled the
# schema that defines them is never created and the baseline migration fails on
# its first policy, so the contract suite cannot run without this.
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
