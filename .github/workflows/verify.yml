name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # `next build` prerenders the static shell of every route, and that shell
    # constructs a Supabase client. Without these the build dies on the first
    # auth-touching page. They are deliberately fake: the build must never reach
    # a real project, and the unauthenticated shell is what belongs in the
    # artifact anyway. Anything needing a live database is a runtime concern.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_real_key
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  database-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: supabase db start
      - run: supabase test db --local

  instant-navigation:
    needs: verify
    runs-on: ubuntu-latest
    # Unlike `verify`, this job runs the server it builds, so it wants a real
    # project. NEXT_PUBLIC_* is inlined at build time, which is why it cannot
    # reuse the placeholder build from `verify`. Until the secrets are added the
    # fallbacks keep the build honest and the specs skip themselves.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_ci_placeholder_not_a_real_key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'sb_secret_ci_placeholder_not_a_real_key' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_EXHAUSTIVE_INSTANT_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:e2e
