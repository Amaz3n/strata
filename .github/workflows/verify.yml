name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # `next build` prerenders the static shell of every route, and that shell
    # constructs a Supabase client. Without these the build dies on the first
    # auth-touching page. They are deliberately fake: the build must never reach
    # a real project, and the unauthenticated shell is what belongs in the
    # artifact anyway. Anything needing a live database is a runtime concern.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_real_key
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:precon
      - run: pnpm test:documents
      - run: pnpm verify

  database-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: supabase db start
      # Repository half only: no credentials exist in this job, so it checks names
      # and versions are unique and well-formed (production parity is the job below).
      - run: node ./scripts/check-migration-ledger.mjs
      - name: Require drawing lifecycle SQL contract
        run: |
          test -s supabase/tests/drawing_lifecycle.test.sql
          set -o pipefail
          supabase test db supabase/tests/drawing_lifecycle.test.sql --local | tee /tmp/drawing-lifecycle-tap.log
          grep -q 'Tests=6' /tmp/drawing-lifecycle-tap.log
      - run: supabase test db --local

  # Exact parity between supabase/migrations and the production ledger. Trusted refs
  # only: pushes to main and manual runs, never pull requests (same-repo PR code could
  # read the key). The key lives in the `production-ledger` environment, whose
  # protection rules (required reviewers, main only) are set in the repository
  # settings. Until those secrets exist the script runs its repository half and says so.
  migration-ledger-parity:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ledger
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LEDGER_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LEDGER_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pending repository migrations (awaiting approval) are listed, not failed; the ledger
      # holding a migration the repository lacks, or one version under two names, fails.
      # Without the secrets the run warns that production was not checked.
      - run: node ./scripts/check-migration-ledger.mjs --allow-pending --require-production

  drawing-lifecycle-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Real components and upload hook, deterministic fixtures, no live credentials.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:drawings-ui
      - run: pnpm test:documents-ui

  books-payroll-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Actual review component/actions/services with disposable SQL and provider bytes.
    # Authentication and transport are explicit fixtures; no live credentials.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:books:payroll-ui

  instant-navigation:
    needs: verify
    runs-on: ubuntu-latest
    # Unlike `verify`, this job runs the server it builds, so it wants a real
    # project. NEXT_PUBLIC_* is inlined at build time, which is why it cannot
    # reuse the placeholder build from `verify`. Until the secrets are added the
    # fallbacks keep the build honest and the specs skip themselves.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_ci_placeholder_not_a_real_key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'sb_secret_ci_placeholder_not_a_real_key' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_EXHAUSTIVE_INSTANT_VALIDATION: "true"
      NEXT_INSTANT_NAVIGATION_TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:e2e
      - run: pnpm test:navigation:browser

  native-field-recovery:
    runs-on: macos-latest
    timeout-minutes: 10
    # Compile production Swift state/persistence code with isolated storage and I/O.
    # No app session, live credentials, real Keychain writes or customer network calls.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/ios-service-visits.test.js tests/ios-service-completion-journal.test.js
